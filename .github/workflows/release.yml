name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $(git rev-list --count HEAD)" Resources/Info.plist
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: |
          brew install create-dmg
          ./build.sh --release

      - name: Upload build artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Tiler
          path: |
            Tiler.dmg
            Tiler.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Tiler.dmg Tiler.zip --title "$GITHUB_REF_NAME" --generate-notes

      - name: Update Homebrew cask
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN not set, skipping cask update"
            exit 0
          fi
          SHA=$(shasum -a 256 Tiler.zip | cut -d' ' -f1)
          FILE=repos/VlatkoMilisav/homebrew-tap/contents/Casks/tiler.rb
          gh api "$FILE" -q .content | base64 -d \
            | sed -E "s/version \"[^\"]+\"/version \"$VERSION\"/; s/sha256 \"[^\"]+\"/sha256 \"$SHA\"/" > tiler.rb
          gh api -X PUT "$FILE" \
            -f message="Update tiler to $VERSION" \
            -f content="$(base64 < tiler.rb)" \
            -f sha="$(gh api "$FILE" -q .sha)"
